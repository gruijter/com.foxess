<script type="text/javascript">
  function __ (key, fallback) {
    var tr = Homey.__(key);
    return (tr && tr !== key) ? tr : fallback;
  }

  // Per the FoxESS OpenAPI document a heat pump is registered by the serial number of its outdoor
  // unit (heat/register) before the API lists it. The driver registers the serial entered here,
  // unless it is already registered; an empty field skips straight to the heat pumps already
  // registered on the account.
  async function next() {
    try {
      Homey.showLoadingOverlay();
      var result = await Homey.emit('register_heatpump', {
        sn: document.getElementById('heatSn').value.trim()
      });
      Homey.hideLoadingOverlay();
      if (result && result.registered && result.status !== 'approved') {
        await Homey.alert(__('pair.heatpump.pending', 'The heat pump is registered. It can be used in Homey once the registration is approved.'), 'info');
      }
      Homey.nextView();
    } catch (error) {
      Homey.hideLoadingOverlay();
      Homey.alert(error.message || error.toString(), 'error');
    }
  }

  Homey.setTitle(__('pair.heatpump.title', 'Register heat pump'));
  document.getElementById('intro').innerText = __('pair.heatpump.intro', 'Enter the serial number of the outdoor unit to register a new heat pump. Leave it empty to show the heat pumps already registered.');
  document.getElementById('heatSnLabel').innerText = __('pair.heatpump.serial', 'Outdoor unit serial number');
  document.getElementById('next').innerText = __('pair.heatpump.next', 'Next');
  Homey.ready();
</script>

<div class="homey-form">
  <p class="homey-text" id="intro"></p>
  <div class="homey-form-group">
    <label class="homey-form-label" for="heatSn" id="heatSnLabel"></label>
    <input class="homey-form-input" id="heatSn" type="text" autocomplete="off" spellcheck="false" />
  </div>
</div>
<button class="homey-button-primary-full" id="next" onclick="next()" style="margin-top: 24px;"></button>
